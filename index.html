<html lang="id">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <body class="bg-neutral-900 text-neutral-100 antialiased font-sans">
    <div id="root">
      <!-- Splash Screen saat pertama kali dibuka -->
      <div style="min-height: 100vh; background-color: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #ffffff;">
        <div style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #064e3b, #050505); border: 2px solid #10b981; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25); margin-bottom: 16px;">
          <span style="font-size: 26px; font-weight: 800; color: #34d399; letter-spacing: -0.5px;">FJ</span>
        </div>
        <div style="font-size: 18px; font-weight: 700; color: #f5f5f5; margin-bottom: 6px;">Finance Journal Pro</div>
        <div style="font-size: 12px; color: #10b981; font-weight: 500;">Memuat Aplikasi Keuangan...</div>
      </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
