# Render Blueprint — Finance Journal Pro
# Cara pakai: buka https://render.com/deploy?repo=https://github.com/bariqal38-Fx/finance
# lalu login (gratis, bisa pakai akun GitHub) dan isi DATABASE_URL.
services:
  - type: web
    name: finance-journal-pro
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
